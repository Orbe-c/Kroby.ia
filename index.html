<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"/>
<title>Kroby.IA</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --beige-50:#fdf8f0;
  --beige-100:#f5ead6;
  --beige-200:#e8d5b0;
  --beige-300:#d4b483;
  --beige-400:#b8925a;
  --brown-dark:#2c1a0e;
  --brown-mid:#4a2c0a;
  --brown-soft:#8a6040;
  --brown-muted:#a08060;
  --red:#c0392b;
  --red-dark:#96281b;
  --red-light:#e74c3c;
  --green:#27ae60;
  --green-dark:#1e8449;
  --purple:#7c3aed;
  --purple-dark:#5b21b6;
  --purple-light:#a855f7;
  --pink:#db2777;
  --pink-dark:#9d174d;
  --font-main:'Sora',sans-serif;
  --font-body:'Inter',sans-serif;
}

html{
  height:100%;
  /* dvh adapts to keyboard on modern browsers */
  height:100dvh;
}
body{
  height:100%;
  height:100dvh;
  font-family:var(--font-body);
  background:var(--beige-50);
  color:var(--brown-dark);
  /* NO overflow:hidden ni position:fixed — eso mataba el scroll */
  overflow:hidden;
}

/* ══════════ LANDING SELECTOR ══════════ */
#landing{
  position:fixed;inset:0;z-index:100;
  background:var(--beige-50);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:48px;
  transition:opacity .4s ease, transform .4s ease;
  overflow-y:auto;
  padding:20px;
}
#landing.hide{opacity:0;pointer-events:none;transform:scale(0.97)}

.landing-logo{display:flex;flex-direction:column;align-items:center;gap:14px}
.landing-logo-icon{
  width:72px;height:72px;border-radius:20px;
  background:var(--beige-100);border:1px solid var(--beige-200);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.landing-logo-icon img{width:80%;height:80%;object-fit:contain}
.landing-title{
  font-family:var(--font-main);font-size:28px;font-weight:700;
  color:var(--brown-dark);letter-spacing:-0.01em;
}
.landing-title em{color:var(--green);font-style:normal}
.landing-sub{font-size:14px;color:var(--brown-soft);margin-top:-8px;letter-spacing:0.01em}

.selector-cards{display:flex;gap:20px;align-items:stretch}
.sel-emoji img{width:90%;height:90%;object-fit:contain}

.sel-card{
  width:220px;padding:32px 24px;
  border-radius:20px;border:1.5px solid var(--beige-200);
  background:#fff;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:16px;
  text-align:center;
  transition:transform .2s,border-color .2s,box-shadow .2s;
  position:relative;overflow:hidden;
  touch-action:manipulation;
  user-select:none;
}
.sel-card::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .25s}
.sel-card.male::before{background:linear-gradient(135deg,rgba(192,57,43,0.06),rgba(39,174,96,0.06))}
.sel-card.female::before{background:linear-gradient(135deg,rgba(124,58,237,0.07),rgba(219,39,119,0.07))}
.sel-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,0.1)}
.sel-card:active{transform:scale(0.97)}
.sel-card.male:hover{border-color:var(--red)}
.sel-card.female:hover{border-color:var(--purple)}
.sel-card:hover::before{opacity:1}

.sel-emoji{
  width:64px;height:64px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  font-size:34px;flex-shrink:0;
}
.sel-card.male .sel-emoji{background:linear-gradient(135deg,#fde8e6,#e8f5ee)}
.sel-card.female .sel-emoji{background:linear-gradient(135deg,#f3e8ff,#fce7f3)}

.sel-label{font-family:var(--font-main);font-size:17px;font-weight:700;color:var(--brown-dark)}
.sel-desc{font-size:12px;color:var(--brown-soft);line-height:1.55}
.sel-tag{
  padding:5px 14px;border-radius:20px;font-size:11px;font-weight:600;
  font-family:var(--font-main);letter-spacing:0.04em;
}
.sel-card.male .sel-tag{background:#fde8e6;color:var(--red)}
.sel-card.female .sel-tag{background:#f3e8ff;color:var(--purple)}

/* ══════════ APP SHELL ══════════ */
.app{
  display:flex;
  /* KEY FIX: usar dvh para que se ajuste cuando aparece el teclado */
  height:100dvh;
  /* fallback para navegadores sin dvh */
  height:100vh;
  overflow:hidden;
}

/* SIDEBAR */
.sidebar{
  width:260px;min-width:260px;
  display:flex;flex-direction:column;
  border-right:1px solid rgba(255,255,255,0.06);
  transition:background .3s;
  /* Sidebar siempre a altura completa */
  height:100%;
  overflow:hidden;
}
.app.male .sidebar{background:#2c1a0e}
.app.female .sidebar{background:#1e0a2e}

.sb-header{
  padding:16px 12px 12px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:0.5px solid rgba(255,255,255,0.07);
  flex-shrink:0;
}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer}
.logo-icon img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.logo-icon{
  width:34px;height:34px;border-radius:10px;
  background:rgba(255,255,255,0.12);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  overflow:hidden;
}
.logo-name{
  font-family:var(--font-main);font-size:15px;font-weight:600;
  color:rgba(255,255,255,0.85);letter-spacing:0.02em;
}
.logo-name em{font-style:normal}
.app.male .logo-name em{color:var(--green)}
.app.female .logo-name em{color:var(--purple-light)}

.version-badge{
  font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;
  font-family:var(--font-main);letter-spacing:0.05em;margin-left:4px;
}
.app.male .version-badge{background:rgba(192,57,43,0.25);color:#f5a899}
.app.female .version-badge{background:rgba(124,58,237,0.25);color:#c4b5fd}

.icon-btn-sb{
  background:none;border:none;cursor:pointer;
  color:rgba(255,255,255,0.35);padding:5px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s;
  touch-action:manipulation;
}
.icon-btn-sb:hover{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.8)}

.new-chat-btn{
  margin:12px 10px 6px;padding:9px 14px;border-radius:9px;
  background:rgba(255,255,255,0.06);
  color:rgba(255,255,255,0.65);font-size:13px;
  font-family:var(--font-body);cursor:pointer;
  display:flex;align-items:center;gap:9px;
  border:0.5px solid rgba(255,255,255,0.1);
  transition:background .15s;
  touch-action:manipulation;
  flex-shrink:0;
}
.new-chat-btn:hover{background:rgba(255,255,255,0.11);color:rgba(255,255,255,0.9)}

.sb-spacer{flex:1}
.sb-footer{padding:10px;border-top:0.5px solid rgba(255,255,255,0.07);flex-shrink:0}
.user-row{
  display:flex;align-items:center;gap:10px;
  padding:8px 6px;border-radius:8px;cursor:pointer;
  transition:background .12s;
}
.user-row:hover{background:rgba(255,255,255,0.06)}
.avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;object-fit:cover}
.user-name{font-size:13px;color:rgba(255,255,255,0.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-plan{font-size:11px;color:rgba(255,255,255,0.3)}

/* ══════════ MAIN — el fix central ══════════ */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
  /* KEY FIX: altura dinámica que se adapta al teclado */
  height:100%;
  /* Sin overflow:hidden aquí — el scroll va en chat-area */
  overflow:hidden;
}
.app.male .main{background:var(--beige-50)}
.app.female .main{background:#faf5ff}

.topbar{
  padding:12px 20px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.app.male .topbar{border-bottom:0.5px solid var(--beige-200);background:#fff}
.app.female .topbar{border-bottom:0.5px solid #e9d5ff;background:#fdf4ff}

.model-pill{
  display:flex;align-items:center;gap:7px;
  padding:6px 14px;border-radius:20px;
  cursor:pointer;font-size:13px;font-weight:500;
  font-family:var(--font-main);transition:background .15s;
}
.app.male .model-pill{border:0.5px solid var(--beige-200);background:#fff;color:var(--brown-mid)}
.app.female .model-pill{border:0.5px solid #e9d5ff;background:#fdf4ff;color:var(--purple-dark)}
.app.male .model-pill:hover{background:var(--beige-50)}
.app.female .model-pill:hover{background:#f5e8ff}

.dot-m{width:8px;height:8px;border-radius:50%;background:var(--red)}
.dot-g{width:8px;height:8px;border-radius:50%;background:var(--green)}
.dot-p{width:8px;height:8px;border-radius:50%;background:var(--purple-light)}
.dot-pk{width:8px;height:8px;border-radius:50%;background:var(--pink)}

.topbar-actions{display:flex;gap:7px}
.icon-btn-top{
  width:34px;height:34px;border-radius:8px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .15s;touch-action:manipulation;border:none;
}
.app.male .icon-btn-top{border:0.5px solid var(--beige-200);background:#fff;color:var(--brown-soft)}
.app.female .icon-btn-top{border:0.5px solid #e9d5ff;background:#fdf4ff;color:var(--purple)}
.app.male .icon-btn-top:hover{background:var(--beige-100)}
.app.female .icon-btn-top:hover{background:#ede9fe}

/* ══════════ CHAT AREA — el scroll real ══════════ */
.chat-area{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  /* KEY FIX: min-height:0 permite que flex-child se encoja y haga scroll */
  min-height:0;
  padding:24px 20px 16px;
  display:flex;
  flex-direction:column;
  gap:20px;
  /* iOS smooth scroll */
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
  scroll-behavior:smooth;
}
.chat-area::-webkit-scrollbar{width:5px}
.chat-area::-webkit-scrollbar-track{background:transparent}
.chat-area::-webkit-scrollbar-thumb{border-radius:3px}
.app.male .chat-area::-webkit-scrollbar-thumb{background:var(--beige-200)}
.app.female .chat-area::-webkit-scrollbar-thumb{background:#ddd6fe}

/* Welcome */
.welcome{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;flex:1;gap:16px;padding:20px 0 30px;
  min-height:200px;
}
.welcome h1{font-family:var(--font-main);font-size:22px;font-weight:600;text-align:center}
.app.male .welcome h1{color:var(--brown-dark)}
.app.female .welcome h1{color:var(--purple-dark)}
.welcome p{font-size:14px;text-align:center;max-width:320px;line-height:1.65}
.app.male .welcome p{color:var(--brown-soft)}
.app.female .welcome p{color:#6d28d9}

.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.chip{
  padding:7px 15px;border-radius:20px;font-size:12px;cursor:pointer;
  transition:border-color .15s,color .15s,background .15s;
  font-family:var(--font-body);touch-action:manipulation;
  user-select:none;
}
.app.male .chip{border:0.5px solid var(--beige-200);background:#fff;color:var(--brown-mid)}
.app.female .chip{border:0.5px solid #e9d5ff;background:#fdf4ff;color:var(--purple-dark)}
.app.male .chip:hover{border-color:var(--red);color:var(--red);background:#fff5f4}
.app.female .chip:hover{border-color:var(--purple);color:var(--purple);background:#f5f0ff}

/* Messages */
.msg{display:flex;gap:10px;align-items:flex-start;flex-shrink:0}
.msg.user{flex-direction:row-reverse}
.msg-av{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.msg-av img{width:100%;height:100%;border-radius:50%;object-fit:cover}

.msg-bubble{
  padding:12px 16px;border-radius:14px;
  font-size:14px;line-height:1.7;max-width:78%;
  white-space:pre-wrap;word-break:break-word;
}
.app.male .msg.user .msg-bubble{
  background:linear-gradient(135deg,var(--red),#a93226);
  color:#fff;border-bottom-right-radius:3px;
}
.app.female .msg.user .msg-bubble{
  background:linear-gradient(135deg,var(--purple),var(--pink));
  color:#fff;border-bottom-right-radius:3px;
}
.msg.ai .msg-bubble{
  background:#fff;border-bottom-left-radius:3px;
  box-shadow:0 1px 4px rgba(0,0,0,0.04);
}
.app.male .msg.ai .msg-bubble{color:var(--brown-dark);border:0.5px solid var(--beige-200)}
.app.female .msg.ai .msg-bubble{color:var(--purple-dark);border:0.5px solid #e9d5ff}

/* ══════════ COMPOSER — pegado al fondo ══════════ */
.composer-wrap{
  /* KEY FIX: flex-shrink:0 y no position absolute */
  flex-shrink:0;
  padding:10px 20px 18px;
  /* KEY FIX: safe area para notch/home indicator */
  padding-bottom:max(18px, env(safe-area-inset-bottom, 18px));
}
.app.male .composer-wrap{background:var(--beige-50)}
.app.female .composer-wrap{background:#faf5ff}

.composer{
  border-radius:16px;padding:12px 14px;
  display:flex;flex-direction:column;gap:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.05);
  transition:border-color .2s,box-shadow .2s;
  background:#fff;
}
.app.male .composer{border:1px solid var(--beige-200)}
.app.female .composer{border:1px solid #e9d5ff}
.app.male .composer:focus-within{border-color:var(--red);box-shadow:0 2px 8px rgba(192,57,43,0.12)}
.app.female .composer:focus-within{border-color:var(--purple);box-shadow:0 2px 8px rgba(124,58,237,0.12)}

.composer-input{
  border:none;outline:none;background:none;
  /* KEY FIX: 16px previene zoom automático en iOS al hacer focus */
  font-size:16px;
  color:var(--brown-dark);
  resize:none;min-height:40px;max-height:120px;
  line-height:1.55;font-family:var(--font-body);width:100%;
  -webkit-appearance:none;
  appearance:none;
}
.app.female .composer-input{color:var(--purple-dark)}
.composer-input::placeholder{color:#b8a080}
.app.female .composer-input::placeholder{color:#a78bfa}

.composer-footer{display:flex;align-items:center;justify-content:space-between}
.composer-tools{display:flex;gap:6px}
.tool-btn{
  padding:5px 12px;border-radius:8px;cursor:pointer;font-size:12px;
  display:flex;align-items:center;gap:5px;
  font-family:var(--font-body);background:none;
  transition:background .12s,border-color .12s,color .12s;
  touch-action:manipulation;
}
.app.male .tool-btn{border:0.5px solid var(--beige-200);color:var(--brown-soft)}
.app.female .tool-btn{border:0.5px solid #e9d5ff;color:var(--purple)}

.send-btn{
  width:44px;height:44px;border-radius:12px;
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,transform .1s;flex-shrink:0;
  touch-action:manipulation;
  -webkit-appearance:none;
  appearance:none;
}
.app.male .send-btn{background:var(--red)}
.app.female .send-btn{background:var(--purple)}
.app.male .send-btn:hover{background:var(--red-dark)}
.app.female .send-btn:hover{background:var(--purple-dark)}
.send-btn:active{transform:scale(0.92);opacity:0.85}

.disclaimer{text-align:center;font-size:11px;padding:5px 0 0;line-height:1.5}
.app.male .disclaimer{color:#b8a080}
.app.female .disclaimer{color:#a78bfa}

.back-btn{
  display:flex;align-items:center;gap:6px;
  font-size:12px;cursor:pointer;
  padding:5px 10px;border-radius:8px;border:none;background:none;
  font-family:var(--font-body);transition:background .15s;margin-top:2px;
  touch-action:manipulation;
}
.app.male .back-btn{color:rgba(255,255,255,0.4)}
.app.female .back-btn{color:rgba(255,255,255,0.4)}
.back-btn:hover{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.8)!important}

/* Typing indicator */
.typing{display:flex;gap:5px;align-items:center;padding:14px 16px}
.typing span{width:7px;height:7px;border-radius:50%;animation:bounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
.app.male .typing span{background:var(--brown-muted)}
.app.female .typing span{background:#a78bfa}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

/* ══════════ MOBILE ══════════ */
@media(max-width:640px){
  .sidebar{display:none}

  .topbar{padding:10px 14px}

  .chat-area{
    padding:16px 14px 12px;
  }

  .composer-wrap{
    padding:8px 12px;
    /* KEY FIX: safe area dinámica en iPhone con home indicator */
    padding-bottom:max(12px, env(safe-area-inset-bottom, 12px));
  }

  .composer{padding:10px 12px;gap:8px}

  .chip{padding:8px 16px;font-size:13px}

  .send-btn{width:48px;height:48px;border-radius:14px}

  .tool-btn{padding:6px 10px}

  .selector-cards{flex-direction:column;gap:14px}
  .sel-card{width:100%;max-width:320px;padding:24px 20px}

  .welcome{padding:10px 0 20px;gap:12px}
  .welcome h1{font-size:19px}

  .msg-bubble{max-width:88%;font-size:14px}

  .mobile-back{
    display:flex;align-items:center;gap:6px;
    font-size:13px;cursor:pointer;
    padding:6px 10px;border-radius:8px;border:none;background:none;
    font-family:var(--font-body);transition:background .15s;
    touch-action:manipulation;
  }
  .app.male .mobile-back{color:var(--brown-soft)}
  .app.female .mobile-back{color:var(--purple)}
}

@media(min-width:641px){
  .mobile-back{display:none}
}
</style>
</head>
<body>

<!-- ══ LANDING ══ -->
<div id="landing">
  <div class="landing-logo">
    <div class="landing-logo-icon">
      <img id="logoKroby" src="kroby/kroby.png" alt="Kroby">
    </div>
    <div class="landing-title">kroby<em>.ia</em></div>
    <div class="landing-sub">Elige tu versión</div>
  </div>

  <div class="selector-cards">
    <div class="sel-card male" id="btnMale">
      <div class="sel-emoji"><img src="kroby/kroby.png"></div>
      <div class="sel-label">Kroby Hombres</div>
      <div class="sel-desc">Te ayudo con las nenas</div>
      <div class="sel-tag">VERSIÓN MASCULINA</div>
    </div>
    <div class="sel-card female" id="btnFemale">
      <div class="sel-emoji"><img src="kroby/krobyg.png"></div>
      <div class="sel-label">Kroby Chicas</div>
      <div class="sel-desc">Te ayudo a ligar hombres</div>
      <div class="sel-tag">VERSIÓN FEMENINA</div>
    </div>
  </div>
</div>

<!-- ══ APP ══ -->
<div class="app" id="app" style="display:none">

  <aside class="sidebar">
    <div class="sb-header">
      <a class="logo" id="logoLink">
        <div class="logo-icon">
          <img id="landingKroby" src="kroby/kroby.png" alt="Kroby">
        </div>
        <span class="logo-name">kroby<em>.ia</em></span>
        <span class="version-badge" id="vBadge">CHICOS</span>
      </a>
      <button class="icon-btn-sb" id="btnNewChatSb" title="Nuevo chat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>

    <button class="new-chat-btn" id="btnNewChat2">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      Nuevo chat
    </button>

    <div class="sb-spacer"></div>

    <div class="sb-footer">
      <button class="back-btn" id="btnBack">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Cambiar versión
      </button>
      <div class="user-row">
        <img id="avLetter" class="avatar" src="" alt="Avatar">
        <div class="user-info">
          <div class="user-name" id="userName">Milton</div>
          <div class="user-plan">Plan gratuito</div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="mobile-back" id="btnMobileBack">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      </button>

      <div class="model-pill" id="modelPill">
        <div class="dot-m" id="dot1"></div>
        <div class="dot-g" id="dot2"></div>
        <span id="pillLabel">Kroby Chicos · GRATUITO</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn-top">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>
        </button>
        <button class="icon-btn-top" id="btnNewChatTop">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </div>

    <div class="chat-area" id="chatArea"></div>

    <div class="composer-wrap">
      <div class="composer">
        <textarea
          class="composer-input" id="composerInput"
          placeholder="Escribe tu pregunta a Kroby IA..."
          rows="1"
          autocomplete="off"
          autocorrect="off"
          spellcheck="true"
        ></textarea>
        <div class="composer-footer">
          <div class="composer-tools">
            <button class="tool-btn" type="button">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
              Adjuntar
            </button>
            <button class="tool-btn" type="button">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
              Buscar
            </button>
          </div>
          <button class="send-btn" id="sendBtn" type="button" aria-label="Enviar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>
      <p class="disclaimer">Kroby IA puede cometer errores. Verifica la información importante.</p>
    </div>
  </main>
</div>

<script>
const MALE_CHIPS = ['✍️ Redactar contenido','📊 Analizar datos','💡 Ideas de negocio','🌐 Traducir texto','📧 Redactar email','📅 Planificar tareas'];
const FEMALE_CHIPS = ['💌 Redactar mensaje','✨ Ideas creativas','💬 Consejos relacionales','📚 Recomendar lectura','🎯 Planificar metas','🌸 Bienestar personal'];

const MALE_RESPONSES = [
  `El plan Chill (Café y caminata)\nEs la opción con menos presión. Solo es caminar y platicar. Respondele:\n\n¡Todo bien también! Oye, el clima está perfecto para caminar un rato. ¿Te late si vamos a dar una vuelta al parque el sábado y pasamos por un café?`,
  `¿Tenés ya pensado a qué café la querés llevar, o querés que armemos un par de opciones chileras?`,
  `Tranquilo, respirá! Llegar antes es de caballeros y te da la ventaja de acomodarte bien. No te me vayas a poner ansioso ni a ver el celular cada tres segundos con cara de preocupación.`,
  `Aquí tenés las 4 reglas de oro para que todo fluya:\n\nEscuchá más de lo que hablás: Hacé preguntas abiertas, mostrá interés real en sus respuestas y no conviertas la cita en un monólogo sobre vos.\n\nSé el del plan: Llevá un lugar en mente y opciones claras. A las cheras les trama que un hombre tenga iniciativa y no ande con el "¿y ahora para dónde vamos?".\n\nCero celular: Guardalo en el bolsillo. Estar viendo la pantalla cada cinco minutos mata cualquier conversación y transmite desinterés.\n\nRelajate y sé auténtico: No intentés interpretar un personaje ni impresionar de más. La confianza se nota cuando estás cómodo.`,
  `¡Excelente pregunta! Para empezar suave (romper el hielo):\n\n• ¿Qué te gusta hacer cuando tienes tiempo libre?\n• ¿Eres más de planes tranquilos o de salir a lo loco?\n• ¿Qué tipo de música te gusta últimamente?\n• ¿Café o té?`,
  `Para que la conversación fluya dile:\n\n"¿Qué es algo que te apasiona tanto que podrías dar una charla de 20 minutos sin prepararte?"`,
  `Alcanzaste el límite diario de mensajes. Para continuar la conversación, adquiere la membresía Kroby asistente premium.`,
];

const FEMALE_RESPONSES = [
  `¡Qué buena! A ver, la clave es sonar relajada, como que es un plan casual y ya. Dile algo así: \n ¡Hola! Me parece el plan, suena tranquilo. ¿A qué hora el sábado?`,
  `¡Ay, los nervios! Fresca, no te preocupes.\nPaso uno: saca el celular, haz como que estás revisando algo y quédate en un lugar visible.\nPaso dos: búscale la mirada. En cuanto te vea, sonríele normal, levanta la mano para saludar y quédate ahí para que él camine hacia ti. ¡No vayas corriendo tú!`,
  `Si no quieres estar en la cita simplemente dile esto tal cual:\n  "Oye, qué pena contigo, pero me acaba de surgir una emergencia con mi familia y me tengo que ir ya. Perdón por cortar el plan así`,
];

let mode = 'male';
let msgCount = 0;
let isSending = false;

const landing  = document.getElementById('landing');
const appEl    = document.getElementById('app');
const chatArea = document.getElementById('chatArea');
const input    = document.getElementById('composerInput');
const sendBtn  = document.getElementById('sendBtn');

function enterChat(m) {
  mode = m;
  msgCount = 0;
  landing.classList.add('hide');
  setTimeout(() => { landing.style.display = 'none'; }, 420);
  appEl.style.display = 'flex';
  appEl.className = 'app ' + m;
  applyTheme(m);
  renderWelcome();
}

function applyTheme(m) {
  const f = m === 'female';
  document.getElementById('vBadge').textContent    = f ? 'CHICAS' : 'CHICOS';
  document.getElementById('pillLabel').textContent = f ? 'Kroby Chicas · GRATUITO' : 'Kroby Chicos · GRATUITO';
  document.getElementById('dot1').className = f ? 'dot-p' : 'dot-m';
  document.getElementById('dot2').className = f ? 'dot-pk' : 'dot-g';
  document.getElementById('userName').textContent  = f ? 'Diana' : 'Milton';
  const krobyImg = f ? 'kroby/krobyg.png' : 'kroby/kroby.png';
  document.querySelectorAll('#logoKroby, #landingKroby').forEach(img => img.src = krobyImg);
  document.getElementById('avLetter').src = f ? 'fotoperfil/Diana.jpeg' : 'fotoperfil/Milton.jpeg';
}

function renderWelcome() {
  chatArea.innerHTML = '';
  const f = mode === 'female';
  const chips = f ? FEMALE_CHIPS : MALE_CHIPS;
  const welcome = document.createElement('div');
  welcome.className = 'welcome';
  welcome.id = 'welcome';
  welcome.innerHTML = `
    <div class="landing-logo-icon">
      <img src="${f ? 'kroby/krobyg.png' : 'kroby/kroby.png'}" alt="Kroby">
    </div>
    <h1>${f ? '¿En qué te apoyo hoy? 💜' : '¿En qué te ayudo hoy?'}</h1>
    <p>${f ? 'Soy Kroby IA, tu espacio seguro para ideas, consejos y todo lo que necesites.' : 'Soy Kroby IA, tu asistente inteligente para negocios, creatividad y productividad.'}</p>
    <div class="chips">${chips.map(c => `<div class="chip">${c}</div>`).join('')}</div>
  `;
  welcome.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => sendChip(chip));
  });
  chatArea.appendChild(welcome);
}

function goBack() {
  appEl.style.display = 'none';
  landing.style.display = 'flex';
  setTimeout(() => landing.classList.remove('hide'), 10);
  chatArea.innerHTML = '';
  msgCount = 0;
}

function resetChat() {
  msgCount = 0;
  isSending = false;
  input.disabled = false;
  input.placeholder = 'Escribe tu pregunta a Kroby IA...';
  sendBtn.disabled = false;
  sendBtn.style.opacity = '1';
  renderWelcome();
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function scrollToBottom() {
  /* requestAnimationFrame asegura que el DOM ya está pintado antes de scrollear */
  requestAnimationFrame(() => {
    chatArea.scrollTop = chatArea.scrollHeight;
  });
}

function sendMessage() {
  const text = input.value.trim();
  if (!text || isSending) return;
  isSending = true;

  const w = document.getElementById('welcome');
  if (w) w.remove();

  addMessage(text, 'user');
  input.value = '';
  input.style.height = 'auto';
  /* KEY FIX: devolver el foco al input sin mover la pantalla */
  input.focus({ preventScroll: true });

  const typingEl = addTyping();
  scrollToBottom();

  setTimeout(() => {
    typingEl.remove();
    const responses = mode === 'female' ? FEMALE_RESPONSES : MALE_RESPONSES;
    const resp = responses[msgCount % responses.length];
    addMessage(resp, 'ai');
    msgCount++;
    isSending = false;

    const esLimite = resp.includes('límite diario');
    if (esLimite) {
      input.disabled = true;
      input.placeholder = 'Adquiere la membresía premium para continuar';
      sendBtn.disabled = true;
      sendBtn.style.opacity = '0.4';
    }
    scrollToBottom();
  }, 1100);
}

function sendChip(el) {
  input.value = el.textContent.replace(/^[\p{Emoji}\s]+/u, '').trim();
  sendMessage();
}

function addMessage(text, role) {
  const f = mode === 'female';
  const div = document.createElement('div');
  div.className = 'msg ' + role;

  const av = document.createElement('div');
  av.className = 'msg-av';
  if (role === 'ai') {
    av.innerHTML = `<img src="${f ? 'kroby/krobyg.png' : 'kroby/kroby.png'}" alt="Kroby">`;
  } else {
    av.innerHTML = `<img src="${f ? 'fotoperfil/Diana.jpeg' : 'fotoperfil/Milton.jpeg'}" alt="Usuario">`;
  }

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text;

  div.appendChild(av);
  div.appendChild(bubble);
  chatArea.appendChild(div);
}

function addTyping() {
  const f = mode === 'female';
  const div = document.createElement('div');
  div.className = 'msg ai';
  const av = document.createElement('div');
  av.className = 'msg-av';
  av.innerHTML = `<img src="${f ? 'kroby/krobyg.png' : 'kroby/kroby.png'}" alt="Kroby">`;
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  div.appendChild(av);
  div.appendChild(bubble);
  chatArea.appendChild(div);
  return div;
}

/* ══ EVENTOS ══ */
document.getElementById('btnMale').addEventListener('click', () => enterChat('male'));
document.getElementById('btnFemale').addEventListener('click', () => enterChat('female'));

sendBtn.addEventListener('touchend', function(e) {
  e.preventDefault();
  sendMessage();
});
sendBtn.addEventListener('click', sendMessage);

input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
input.addEventListener('input', function() { autoResize(this); });

document.getElementById('btnBack').addEventListener('click', goBack);
document.getElementById('btnMobileBack').addEventListener('click', goBack);
document.getElementById('logoLink').addEventListener('click', goBack);
document.getElementById('btnNewChatSb').addEventListener('click', resetChat);
document.getElementById('btnNewChat2').addEventListener('click', resetChat);
document.getElementById('btnNewChatTop').addEventListener('click', resetChat);

/* KEY FIX: cuando el teclado aparece en iOS, hacer scroll al último mensaje */
input.addEventListener('focus', function() {
  setTimeout(scrollToBottom, 400);
});
</script>
</body>
</html>
